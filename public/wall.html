<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Shift — the wall</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%230b1517%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%277%27 fill=%27%23e9a23b%27/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* The wall (docs/reveal.md §5): a screen in a room. Left, the door: the QR and the sentences arriving. Right, the
     stage: a 9:16 frame where each painting's reveal plays to the same score as the film. Nothing else. */
  @font-face{font-family:'Instrument Serif';src:url(/fonts/InstrumentSerif-Regular.ttf) format('truetype');font-display:swap}
  @font-face{font-family:'IBM Plex Mono';src:url(/fonts/IBMPlexMono-Regular.ttf) format('truetype');font-display:swap}
  :root{--bg:#0b1517;--ink:#e8e1d3;--dim:#8fa3a3;--amber:#e9a23b;--line:#1c3134;--serif:'Instrument Serif',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;cursor:none}
  body{font:16px/1.5 var(--serif)}
  #wall{display:flex;height:100%;width:100%}
  #door{flex:0 0 auto;width:min(46vw,760px);display:flex;flex-direction:column;justify-content:center;padding:4vh 4vw;gap:3vh;overflow:hidden}
  /* The reveal quiets the door, but NOT the QR — it is the one control in the room and someone walking
     in mid-reveal has to be able to scan it. Opacity composites, so a child cannot undo a dimmed
     parent: the siblings dim, the code does not (Diego, 2026-09-09: "a bit darker than the rest"). */
  #wall.revealing #ask,#wall.revealing #room,#wall.revealing #lab,#wall.revealing #queue li:not(.playing){opacity:.28}
  #queue li{transition:opacity 1.2s ease}
  #ask,#room,#queue,#lab{transition:opacity 1.2s ease}
  #ask{font-size:clamp(28px,4.2vw,64px);line-height:1.06;margin:0;font-weight:400}
  #qr{width:min(34vh,26vw);aspect-ratio:1;background:#fff;padding:3%;border-radius:4px}
  #qr img,#qr canvas{width:100%!important;height:100%!important;display:block}
  #room{color:var(--dim);font-family:var(--mono);font-size:clamp(12px,1.1vw,18px);margin:0}
  /* Whose room this is, at the foot of the door: the mark plus the name in the wall's own type, because
     the lockup's wordmark is dark navy and would disappear on this ground. Quiet enough that a person
     reads the paintings first and the maker second. */
  #lab{display:flex;align-items:center;gap:.6em;margin:.6vh 0 0;color:var(--dim);font-family:var(--mono);font-size:clamp(12px,1.05vw,18px)}
  #lab img{width:auto;height:clamp(30px,3.8vh,52px)}
  /* A list of PAINTINGS, so every row carries the painting (Diego, 2026-09-09: "the way we're showing
     the list of painting requests is terrible - rethink it"). It was a wall of mono text next to a wall
     of pictures; nobody scanning it could tell which sentence had become what. Each row is now a tile of
     the work itself, and the sentence sits beside it in one glance-sized line.
     Two columns across the door's own width, twelve rows, and the state said in light alone. */
  #queue{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.1vh 1.6vw;min-height:0;flex:0 1 auto;overflow:hidden;align-content:start}
  /* Only fades when there is genuinely more than the door can hold — a mask on the element itself is a
     share of its own height, so a three-row list was fading its own last row for no reason. */
  #queue.more{-webkit-mask-image:linear-gradient(180deg,#000 82%,transparent);mask-image:linear-gradient(180deg,#000 82%,transparent)}
  #queue li{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.8em;animation:arrive 1.1s cubic-bezier(.2,.7,.2,1)}
  /* The tile: the painting once there is one, a slow amber breath while it is being made. */
  #queue .art{position:relative;flex:0 0 auto;width:clamp(38px,5.4vh,62px);aspect-ratio:1;border-radius:3px;overflow:hidden;background:var(--line)}
  #queue .art img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .9s ease}
  #queue li.done .art img{opacity:1}
  /* The ring is its own element on purpose: an inset shadow on .art paints UNDER the painting that
     fills it, so the one mark the room is meant to read was invisible on exactly the rows that have a
     painting. This sits above the image. */
  #queue .ring{position:absolute;inset:0;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(232,225,211,.1);transition:box-shadow .4s ease}
  #queue li:not(.done) .art::after{content:'';position:absolute;inset:0;background:var(--amber);opacity:.06;animation:breathe 2.4s ease-in-out infinite}
  /* How far off a painting is, said as a level rising in its own empty frame rather than as a sentence
     (Diego, 2026-09-09: "show an estimation of how long it will still take — visual indication and not
     text please"). It approaches the usual time asymptotically and never fills: only the painting
     arriving finishes it, so the wall cannot promise a moment it does not know. */
  #queue .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,rgba(233,162,59,.5),rgba(233,162,59,.14));border-top:1px solid rgba(233,162,59,.95);transition:height 1s linear}
  #queue li.done .fill{opacity:0;transition:opacity .8s ease}
  #queue .text{min-width:0;font-family:var(--mono);line-height:1.35}
  /* Two lines, each with one job: what someone asked for, and who asked for it. The painting's title
     used to sit here too, jammed against the name behind a dot — but the tile already shows what the
     sentence became, and the title gets its whole moment on the stage. */
  #queue .line{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:clamp(12px,1.02vw,17px);color:var(--ink)}
  /* Wraps rather than ellipsises: "commissioned by" costs sixteen characters before the name starts, so
     a single nowrap line cut most names in half ("commissioned by Proudly …"). Only the dense list,
     where the rows are already tight, holds it to one. */
  #queue .foot{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:clamp(10px,.82vw,14px);color:var(--dim);margin-top:.25em}
  #queue.dense .foot{-webkit-line-clamp:1}
  #queue .foot:empty{display:none}
  #queue .who{font-style:normal;color:var(--ink)}
  /* Which painting is on the wall RIGHT NOW, said with light and nothing else (Diego, 2026-09-09:
     "I just want a visual indication, no additional text"): the tile lights up, and it is the one row
     the reveal does not dim. The row queued to play next wears the same ring, far weaker — one mark at
     two strengths rather than two marks to decode. */
  /* Five to ten people sending at once is the case this is for (Diego, 2026-09-09), and every one of
     them has to find their own sentence on the wall. Past six the rows tighten — smaller tile, one line
     of sentence — so ten fit where eight did, instead of the oldest sliding out of view. */
  #queue.dense{gap:.85vh 1.4vw}
  #queue.dense .art{width:clamp(30px,4.1vh,46px)}
  #queue.dense .line{-webkit-line-clamp:1;font-size:clamp(11px,.92vw,15px)}
  #queue.dense li{gap:.65em}
  #queue li.next .ring{box-shadow:inset 0 0 0 1px rgba(233,162,59,.4)}
  #queue li.playing .ring{box-shadow:inset 0 0 0 2px var(--amber)}
  #queue li.playing .art{box-shadow:0 0 1.6em rgba(233,162,59,.5)}
  #queue li.playing .line{color:#fff}
  #queue li.playing .what{color:var(--amber)}
  #wall.revealing #queue li.playing{opacity:1}
  @keyframes arrive{from{transform:translateX(-40px);opacity:0}}
  @keyframes breathe{0%,100%{opacity:.05}50%{opacity:.22}}

  /* The film is 9:16 because Instagram is. A 16:9 wall is the opposite shape, so a full 9:16 frame can
     never be more than ~31% of the screen however the rest is arranged. The wall therefore shows the
     BAND of the score that carries the work — the canvas and the caption under it — and crops the empty
     head and tail room the Reel needs. Same coordinates, same timing, ~40% more painting.
     (VIEW_TOP/VIEW_H are mirrored in fit() below; change both or neither.) */
  #frame{flex:1;min-width:0;height:100%;position:relative;overflow:hidden;background:#000}
  #stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;background:#000}
  #fill{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(60px) brightness(.3);transform:scale(1.15)} /* spans the whole frame now, so it is blurred further and dimmer */
  #canvas{position:absolute;left:124px;top:250px;width:832px;height:1040px;overflow:hidden;transform-origin:50% 50%} /* the score's canvas; set again from SC.canvas when the feed arrives */
  #canvas img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #canvas #sig{position:absolute;display:none;inset:auto;width:auto;height:auto;object-fit:fill} /* placed by the score, not the canvas rule above */
  /* Wider than the stage on purpose: the frame is now wider than the score, and the opening is a fade
     FROM black — a black that stopped at the stage's edge would leave the blurred fill glowing beside it. */
  #black{position:absolute;left:-2400px;right:-2400px;top:0;bottom:0;background:#000}
  #sentence{position:absolute;left:72px;right:72px;top:170px;height:1360px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--mono);font-size:44px;line-height:1.5;color:var(--ink);will-change:transform,opacity}
  #sentence .w{white-space:nowrap}
  #sentence .g{opacity:0}
  #sentence>div{position:relative;max-width:100%}
  #sentence.lit>div{padding:var(--band) 60px;margin:calc(-1 * var(--band)) -60px;background:linear-gradient(180deg,transparent,rgba(0,0,0,var(--scrim)) 30%,rgba(0,0,0,var(--scrim)) 70%,transparent)} /* the lit opening: a soft dark band behind the words only, lifting with them (score.ts OPENINGS) */
  #cursor{position:absolute;width:.08em;height:1em;background:var(--amber);border-radius:1px;transform:translateY(.25em)}
  #caption{position:absolute;left:124px;top:1338px;width:796px;display:flex;flex-direction:column;gap:22px} /* under the painting, inside Instagram's safe band (score.ts CAPTION) */
  #title{font-family:var(--serif);font-size:64px;line-height:1.1;color:#ffd58a;opacity:0}
  #endline{font-family:var(--mono);font-size:30px;line-height:1.4;color:#a2abbb;opacity:0}
  #idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;color:var(--dim);font-family:var(--mono);font-size:30px;text-align:center;padding:120px}
  #idle img{width:70%;opacity:.7}

  #start{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;cursor:pointer;z-index:10;font-family:var(--mono);color:var(--dim);font-size:clamp(14px,1.4vw,22px);text-align:center;padding:10vw}
  #start b{font:400 clamp(40px,7vw,120px)/1 var(--serif);color:var(--ink)}
  #start.gone{display:none}
  @media (prefers-reduced-motion:reduce){#queue li{animation-duration:.01s}}
</style>
</head>
<body>
<div id="start"><b>Night Shift</b><span id="startline">Tap to start the wall</span></div>
<div id="wall">
  <section id="door">
    <h1 id="ask">Name a place.<br>Get a painting of it.</h1>
    <div id="qr" aria-label="QR code to the send page"></div>
    <p id="room"></p>
    <ul id="queue"></ul>
    <p id="lab"><img src="/brand/experiai.png" alt=""><span>ExperiAI Lab</span></p>
  </section>
  <div id="frame">
    <div id="fill"></div>
    <div id="stage">
      <div id="canvas"><img id="painting" alt=""><img id="sig" alt=""></div>
      <div id="black"></div>
      <div id="caption"><div id="title"></div><div id="endline"></div></div>
      <div id="sentence"></div>
      <div id="idle"><img src="/persona/portrait.png" alt=""><span id="idletext">Nothing painted yet tonight.</span></div>
    </div>
  </div>
</div>
<script>
// ---- the room, the score, the state ----
const params = new URLSearchParams(location.search);
const ROOM = (params.get('room') || '').toLowerCase();
const DEMO = params.get('demo') === '1';
const origin = location.origin;
let SCORE = null;                 // from the list endpoint: the one timeline (api/_lib/score.ts)
const seen = new Set();           // commission ids the wall has shown arriving
const revealed = new Set();       // ids whose reveal has played tonight
const toReveal = [];              // painted work waiting for its reveal
let loop = [];                    // what plays while nothing new arrives, newest first
let lastPlayed = null;            // so a second painting is never skipped in favour of repeating one
let playing = null;               // the reveal on stage
let loopIndex = 0;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const clip = x => Math.min(1, Math.max(0, x));
const ease = x => (1 - Math.cos(Math.PI * clip(x))) / 2;
const easeOut = x => 1 - Math.pow(1 - clip(x), 3); // the painting's settle (score.ts easeOut): one move, slowing to rest before the pen

// ---- layout: the stage is 1080×1920 CSS px scaled to the frame, so the score's pixels apply as written ----
const VIEW_TOP = 170, VIEW_H = 1360; // the visible band of the 1080x1920 score (mirrors #frame's aspect-ratio)
function fit() {
  const f = $('frame'), st = $('stage');
  const s = f.clientHeight / VIEW_H;
  st.style.transform = `scale(${s}) translateY(${-VIEW_TOP}px)`;
  st.style.left = Math.max(0, (f.clientWidth - 1080 * s) / 2) + 'px'; // centred: the frame is wider than the score
}
addEventListener('resize', fit); fit();

// ---- start: one tap unlocks audio and fullscreen, and says which room this is ----
$('start').addEventListener('click', async () => {
  try { await document.documentElement.requestFullscreen(); } catch {}
  audio.init();
  $('start').classList.add('gone');
  tick();
});
if (!ROOM && !DEMO) $('startline').textContent = 'Add ?room=CODE to the address (or ?demo=1). Open a room with scripts/room.mjs.';
if (params.get('start') === '1') { $('start').classList.add('gone'); tick(); } // headless checks: no tap, no audio

// ---- the door: QR and arrivals ----
function drawQr(url) { $('qr').innerHTML = ''; new QRCode($('qr'), { text: url, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M, colorDark: '#0b1517', colorLight: '#ffffff' }); }
if (ROOM) drawQr(`${origin}/send?room=${encodeURIComponent(ROOM)}`); else drawQr(`${origin}/`);
if (DEMO) { $('ask').innerHTML = 'Name a place.<br>Get a painting of it.'; $('room').textContent = 'demo: tonight’s paintings, arriving again'; }

/** What the sender sees happen to their own sentence. It stays on the list after it is painted — the
 *  list used to drop an entry the moment its reveal played, so a room of people watched their sentences
 *  vanish one by one (Diego, 2026-09-09: "it'd be nice if we could see here the submission list/queue,
 *  so people submitting can see the result of their submission reflected"). */
/** What a row says under the sentence: who asked for it, in words rather than as a bare name beside a
 *  title (Diego, 2026-09-09: "maybe say 'commissioned by' behind the person's name when a name is
 *  given"). Nothing at all when the sentence came in anonymously. The state is never said here — the
 *  tile's rising level is the state, and it is the only place it is said. */
function creditLine(c) { const who = senderOf(c); return who ? `commissioned by ${who}` : ''; }
/** How full a waiting tile looks. Asymptotic on the time a painting usually takes, so it slows as it
 *  climbs and stops short: the last of it is the painting turning up, not the clock running out. */
const PAINT_MS = 75_000;
const level = since => 6 + 82 * (1 - Math.exp(-(Date.now() - since) / PAINT_MS));
function tickTiles() {
  for (const li of $('queue').children) {
    if (li.classList.contains('done') || !li.dataset.since) continue;
    li.querySelector('.fill').style.height = level(Number(li.dataset.since)) + '%';
  }
}
setInterval(tickTiles, 1000);
/** Who sent it, when they chose to give a name. A blank name on the send page means `anonymous`, and the
 *  desk withholds `from` entirely for those — so this shows a name only where someone shared one. */
const senderOf = c => (c.from && !c.studio ? String(c.from).trim().slice(0, 28) : '');
function arrive(c) {
  const li = document.createElement('li');
  const words = c.commission ? (c.line || cut(c.commission, (SCORE && SCORE.sentence.maxChars) || 90)) : 'a sentence, sent privately';
  li.innerHTML = `<span class="art"><img alt=""><i class="fill"></i><i class="ring"></i></span><span class="text"><span class="line">${esc(words)}</span><small class="foot"></small></span>`;
  li.dataset.id = c.id;
  $('queue').prepend(li);
  update(c);
  while ($('queue').children.length > 14) $('queue').lastElementChild.remove();
  $('queue').classList.toggle('dense', $('queue').children.length > 6);
  markMore();
  audio.arrive();
}
/** Keep an entry true as the painting moves through the studio: the tile fills with the work itself the
 *  moment there is one, and the foot says who sent it and what it became. */
function update(c) {
  const li = [...$('queue').children].find(l => l.dataset.id === c.id);
  if (!li) return;
  const credit = creditLine(c);
  const foot = li.querySelector('.foot'), img = li.querySelector('.art img');
  if (foot.textContent !== credit) foot.textContent = credit;
  if (c.image && img.getAttribute('src') !== c.image) img.setAttribute('src', c.image);
  li.dataset.since = Date.parse(c.created) || Date.now();
  li.classList.toggle('done', Boolean(c.image) && (c.status === 'painted' || c.status === 'posted'));
  tickTiles();
  markMore(); // a row can grow a line when its title arrives
}
/** Say "there is more below" only when there is: the list shrinks to the door's spare height, so its own
 *  content overflowing is the honest test. */
function markMore() { const q = $('queue'); q.classList.toggle('more', q.scrollHeight > q.clientHeight + 2); }
function markNext() { for (const li of $('queue').children) li.classList.toggle('next', Boolean(toReveal[0]) && li.dataset.id === toReveal[0].id && li.dataset.id !== playing?.id); }
/** The row whose painting is on the stage this second. */
function markPlaying() { for (const li of $('queue').children) li.classList.toggle('playing', Boolean(playing) && li.dataset.id === playing.id); }

// ---- polling: the room's feed, every 4 s; or the studio's last twelve in demo ----
async function poll() {
  try {
    const url = DEMO ? `${origin}/api/commission` : `${origin}/api/commission?room=${encodeURIComponent(ROOM)}`;
    const r = await fetch(url); if (!r.ok) { $('room').textContent = r.status === 404 ? `No room “${ROOM}”. Open it with scripts/room.mjs open ${ROOM}.` : `The studio did not answer (${r.status}). Trying again.`; return; }
    const j = await r.json();
    SCORE = j.score;
    if (j.room) { $('room').textContent = j.room.open ? j.room.name : `${j.room.name} — closed for the night`; }
    const list = (j.commissions || []).slice().sort((a, b) => a.created.localeCompare(b.created));
    if (DEMO) return demoFeed(list.filter(c => c.image).slice(-12));
    for (const c of list) {
      if (!seen.has(c.id) && c.status !== 'withdrawn' && c.status !== 'declined') { seen.add(c.id); arrive(c); } else { update(c); }
      if (c.image && (c.status === 'painted' || c.status === 'posted') && !revealed.has(c.id) && !toReveal.some(x => x.id === c.id) && playing?.id !== c.id) { seen.add(c.id); toReveal.push(c); audio.prime(c.film); }
      if (c.status === 'withdrawn' || c.status === 'declined') { // burned or stopped: off the wall, now
        revealed.delete(c.id); loop = loop.filter(x => x.id !== c.id); const i = toReveal.findIndex(x => x.id === c.id); if (i >= 0) toReveal.splice(i, 1);
        const li = [...$('queue').children].find(l => l.dataset.id === c.id); if (li) li.remove();
        if (playing?.id === c.id) stopReveal();
      }
    }
    markNext();
  } catch (e) { /* the next poll is 4 s away */ }
}

// demo: the last twelve paintings arrive again, one every ~25 s, sentence first, then the reveal
let demoQueue = null, demoTimer = null;
function demoFeed(list) {
  if (demoQueue) return;
  demoQueue = list.slice().reverse();
  const next = () => { const c = demoQueue.shift(); if (!c) { demoQueue = list.slice().reverse(); return next(); } arrive(c); audio.prime(c.film); setTimeout(() => { toReveal.push(c); markNext(); }, 6000); demoTimer = setTimeout(next, 32000); };
  next();
}

// ---- the stage: one clock, the score's functions of t (mirrors api/_lib/film.ts) ----
let glyphs = [], cues = [], sigGeom = null, t0 = 0, raf = 0, SC = null; // SC: this reveal's score (scoreFor), set by layoutSentence
function layoutSentence(text, seed, opening = 'dark') {
  const el = $('sentence'); el.innerHTML = ''; glyphs = [];
  const S = SCORE.sentence;
  const wrap = document.createElement('div');
  for (const word of text.split(' ')) {
    const w = document.createElement('span'); w.className = 'w';
    for (const ch of word) { const g = document.createElement('span'); g.className = 'g'; g.textContent = ch; w.appendChild(g); glyphs.push(g); }
    wrap.appendChild(w); wrap.appendChild(document.createTextNode(' '));
  }
  const cur = document.createElement('span'); cur.id = 'cursor'; wrap.appendChild(cur);
  el.appendChild(wrap);
  el.style.fontSize = S.size + 'px';
  if (wrap.offsetHeight > S.size * 1.5 * S.maxLines + 2) el.style.fontSize = S.minSize + 'px'; // offsetHeight is in the stage's own pixels, before the scale
  // the hand's rhythm, the film's exactly (api/_lib/score.ts typingWeights, seeded by the painting): the film's
  // weights run over the text WITH its spaces; the wall has no glyph for a space, so its weight folds into the next letter
  const weights = typingWeights(text, seed); const cum = []; let acc = 0, gi = 0;
  for (let i = 0; i < text.length; i++) { if (text[i] === ' ') { acc += weights[i]; continue; } cum[gi++] = acc; acc += weights[i]; }
  const { unit, shift } = typingPace(text, seed);
  SC = scoreFor(shift, opening); // this reveal's score: a long line takes its time and everything after it waits (film.ts does the same)
  cues = cum.map(c => S.start + c * unit);
  return cur;
}
// rhythm:begin — a copy of api/_lib/score.ts seeded + typingWeights; test/sound.test.mjs evaluates this block against the original
function seeded(seed) {
  let h = 1779033703 ^ seed.length;
  for (let i = 0; i < seed.length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 3432918353), h = (h << 13) | (h >>> 19);
  let a = h >>> 0;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const RHYTHM = { wordStart: 1.5, capital: 1.25, mark: 1.15, pauseComma: 3, pauseStop: 5, pair: 0.75, jitter: 0.2, hesitate: 0.06, hesitation: 2.4, burst: 0.8, burstLen: 3 };
