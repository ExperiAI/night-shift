<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Shift — the wall</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%230b1517%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%277%27 fill=%27%23e9a23b%27/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* The wall (docs/reveal.md §5): a screen in a room. Left, the door: the QR and the sentences arriving. Right, the
     stage: a 9:16 frame where each painting's reveal plays to the same score as the film. Nothing else. */
  @font-face{font-family:'Instrument Serif';src:url(/fonts/InstrumentSerif-Regular.ttf) format('truetype');font-display:swap}
  @font-face{font-family:'IBM Plex Mono';src:url(/fonts/IBMPlexMono-Regular.ttf) format('truetype');font-display:swap}
  :root{--bg:#0b1517;--ink:#e8e1d3;--dim:#8fa3a3;--amber:#e9a23b;--line:#1c3134;--serif:'Instrument Serif',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;cursor:none}
  body{font:16px/1.5 var(--serif)}
  #wall{display:flex;height:100%;width:100%}
  #door{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:5vh 5vw;gap:4vh;transition:opacity 1.2s ease}
  #wall.revealing #door{opacity:.28}
  #ask{font-size:clamp(28px,4.2vw,64px);line-height:1.08;margin:0;max-width:14ch;font-weight:400}
  #qr{width:min(34vh,26vw);aspect-ratio:1;background:#fff;padding:3%;border-radius:4px}
  #qr img,#qr canvas{width:100%!important;height:100%!important;display:block}
  #room{color:var(--dim);font-family:var(--mono);font-size:clamp(12px,1.1vw,18px);margin:0}
  #queue{list-style:none;margin:0;padding:0;display:grid;gap:1.4vh;max-height:34vh;overflow:hidden}
  #queue li{font-family:var(--mono);font-size:clamp(13px,1.15vw,20px);line-height:1.4;color:var(--ink);padding-left:1.2em;position:relative;transform:translateX(-40px);opacity:0;animation:arrive 1.1s cubic-bezier(.2,.7,.2,1) forwards}
  #queue li::before{content:'';position:absolute;left:0;top:.55em;width:.5em;height:.5em;border-radius:50%;background:var(--amber)}
  #queue li small{display:block;color:var(--dim);font-size:.82em;margin-top:.15em}
  #queue li.next::before{box-shadow:0 0 0 .3em rgba(233,162,59,.18)}
  @keyframes arrive{to{transform:none;opacity:1}}

  #frame{flex:none;height:100%;aspect-ratio:9/16;position:relative;overflow:hidden;background:#000}
  #stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;background:#000}
  #fill{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(40px) brightness(.35);transform:scale(1.08)}
  #canvas{position:absolute;left:124px;top:250px;width:832px;height:1040px;overflow:hidden;transform-origin:50% 50%} /* the score's canvas; set again from SC.canvas when the feed arrives */
  #canvas img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #canvas #sig{position:absolute;display:none;inset:auto;width:auto;height:auto;object-fit:fill} /* placed by the score, not the canvas rule above */
  #black{position:absolute;inset:0;background:#000}
  #sentence{position:absolute;left:72px;right:72px;top:0;height:1920px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--mono);font-size:44px;line-height:1.5;color:var(--ink);will-change:transform,opacity}
  #sentence .w{white-space:nowrap}
  #sentence .g{opacity:0}
  #sentence>div{position:relative;max-width:100%}
  #sentence.lit>div{padding:var(--band) 60px;margin:calc(-1 * var(--band)) -60px;background:linear-gradient(180deg,transparent,rgba(0,0,0,var(--scrim)) 30%,rgba(0,0,0,var(--scrim)) 70%,transparent)} /* the lit opening: a soft dark band behind the words only, lifting with them (score.ts OPENINGS) */
  #cursor{position:absolute;width:.08em;height:1em;background:var(--amber);border-radius:1px;transform:translateY(.25em)}
  #caption{position:absolute;left:124px;top:1338px;width:796px;display:flex;flex-direction:column;gap:22px} /* under the painting, inside Instagram's safe band (score.ts CAPTION) */
  #title{font-family:var(--serif);font-size:64px;line-height:1.1;color:#ffd58a;opacity:0}
  #endline{font-family:var(--mono);font-size:30px;line-height:1.4;color:#a2abbb;opacity:0}
  #idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;color:var(--dim);font-family:var(--mono);font-size:30px;text-align:center;padding:120px}
  #idle img{width:70%;opacity:.7}

  #start{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;cursor:pointer;z-index:10;font-family:var(--mono);color:var(--dim);font-size:clamp(14px,1.4vw,22px);text-align:center;padding:10vw}
  #start b{font:400 clamp(40px,7vw,120px)/1 var(--serif);color:var(--ink)}
  #start.gone{display:none}
  @media (prefers-reduced-motion:reduce){#queue li{animation-duration:.01s}}
</style>
</head>
<body>
<div id="start"><b>Night Shift</b><span id="startline">Tap to start the wall</span></div>
<div id="wall">
  <section id="door">
    <h1 id="ask">Send one sentence about tonight.</h1>
    <div id="qr" aria-label="QR code to the send page"></div>
    <p id="room"></p>
    <ul id="queue"></ul>
  </section>
  <div id="frame">
    <div id="stage">
      <div id="fill"></div>
      <div id="canvas"><img id="painting" alt=""><img id="sig" alt=""></div>
      <div id="black"></div>
      <div id="caption"><div id="title"></div><div id="endline"></div></div>
      <div id="sentence"></div>
      <div id="idle"><img src="/persona/portrait.png" alt=""><span id="idletext">Nothing painted yet tonight.</span></div>
    </div>
  </div>
</div>
<script>
// ---- the room, the score, the state ----
const params = new URLSearchParams(location.search);
const ROOM = (params.get('room') || '').toLowerCase();
const DEMO = params.get('demo') === '1';
const origin = location.origin;
let SCORE = null;                 // from the list endpoint: the one timeline (api/_lib/score.ts)
const seen = new Set();           // commission ids the wall has shown arriving
const revealed = new Set();       // ids whose reveal has played tonight
const toReveal = [];              // painted work waiting for its reveal
let loop = [];                    // what plays while nothing new arrives
let playing = null;               // the reveal on stage
let loopIndex = 0;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const clip = x => Math.min(1, Math.max(0, x));
const ease = x => (1 - Math.cos(Math.PI * clip(x))) / 2;

// ---- layout: the stage is 1080×1920 CSS px scaled to the frame, so the score's pixels apply as written ----
function fit() { const f = $('frame'); const s = f.clientHeight / 1920; $('stage').style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();

// ---- start: one tap unlocks audio and fullscreen, and says which room this is ----
$('start').addEventListener('click', async () => {
  try { await document.documentElement.requestFullscreen(); } catch {}
  audio.init();
  $('start').classList.add('gone');
  tick();
});
if (!ROOM && !DEMO) $('startline').textContent = 'Add ?room=CODE to the address (or ?demo=1). Open a room with scripts/room.mjs.';
if (params.get('start') === '1') { $('start').classList.add('gone'); tick(); } // headless checks: no tap, no audio

// ---- the door: QR and arrivals ----
function drawQr(url) { $('qr').innerHTML = ''; new QRCode($('qr'), { text: url, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M, colorDark: '#0b1517', colorLight: '#ffffff' }); }
if (ROOM) drawQr(`${origin}/send?room=${encodeURIComponent(ROOM)}`); else drawQr(`${origin}/`);
if (DEMO) { $('ask').textContent = 'Send one sentence about tonight.'; $('room').textContent = 'demo: tonight’s paintings, arriving again'; }

function arrive(c) {
  const li = document.createElement('li');
  const words = c.commission ? (c.line || cut(c.commission, (SCORE && SCORE.sentence.maxChars) || 90)) : 'a sentence, sent privately';
  li.innerHTML = `${esc(words)}<small>${esc(c.note || 'Painting it.')}</small>`;
  li.dataset.id = c.id;
  $('queue').prepend(li);
  while ($('queue').children.length > 5) $('queue').lastElementChild.remove();
  audio.arrive();
}
function markNext() { for (const li of $('queue').children) li.classList.toggle('next', toReveal[0] && li.dataset.id === toReveal[0].id); }

// ---- polling: the room's feed, every 4 s; or the studio's last twelve in demo ----
async function poll() {
  try {
    const url = DEMO ? `${origin}/api/commission` : `${origin}/api/commission?room=${encodeURIComponent(ROOM)}`;
    const r = await fetch(url); if (!r.ok) { $('room').textContent = r.status === 404 ? `No room “${ROOM}”. Open it with scripts/room.mjs open ${ROOM}.` : `The studio did not answer (${r.status}). Trying again.`; return; }
    const j = await r.json();
    SCORE = j.score;
    if (j.room) { $('room').textContent = j.room.open ? j.room.name : `${j.room.name} — closed for the night`; }
    const list = (j.commissions || []).slice().sort((a, b) => a.created.localeCompare(b.created));
    if (DEMO) return demoFeed(list.filter(c => c.image).slice(-12));
    for (const c of list) {
      if (!seen.has(c.id) && (c.status === 'queued' || c.status === 'painting')) { seen.add(c.id); arrive(c); }
      if (c.image && (c.status === 'painted' || c.status === 'posted') && !revealed.has(c.id) && !toReveal.some(x => x.id === c.id) && playing?.id !== c.id) { seen.add(c.id); toReveal.push(c); audio.prime(c.film); }
      if (c.status === 'withdrawn' || c.status === 'declined') { // burned or stopped: off the wall, now
        revealed.delete(c.id); loop = loop.filter(x => x.id !== c.id); const i = toReveal.findIndex(x => x.id === c.id); if (i >= 0) toReveal.splice(i, 1);
        const li = [...$('queue').children].find(l => l.dataset.id === c.id); if (li) li.remove();
        if (playing?.id === c.id) stopReveal();
      }
    }
    markNext();
  } catch (e) { /* the next poll is 4 s away */ }
}

// demo: the last twelve paintings arrive again, one every ~25 s, sentence first, then the reveal
let demoQueue = null, demoTimer = null;
function demoFeed(list) {
  if (demoQueue) return;
  demoQueue = list.slice().reverse();
  const next = () => { const c = demoQueue.shift(); if (!c) { demoQueue = list.slice().reverse(); return next(); } arrive(c); audio.prime(c.film); setTimeout(() => { toReveal.push(c); markNext(); }, 6000); demoTimer = setTimeout(next, 32000); };
  next();
}

// ---- the stage: one clock, the score's functions of t (mirrors api/_lib/film.ts) ----
let glyphs = [], cues = [], sigGeom = null, t0 = 0, raf = 0, SC = null; // SC: this reveal's score (scoreFor), set by layoutSentence
function layoutSentence(text, seed, opening = 'dark') {
  const el = $('sentence'); el.innerHTML = ''; glyphs = [];
  const S = SCORE.sentence;
  const wrap = document.createElement('div');
  for (const word of text.split(' ')) {
    const w = document.createElement('span'); w.className = 'w';
    for (const ch of word) { const g = document.createElement('span'); g.className = 'g'; g.textContent = ch; w.appendChild(g); glyphs.push(g); }
    wrap.appendChild(w); wrap.appendChild(document.createTextNode(' '));
  }
  const cur = document.createElement('span'); cur.id = 'cursor'; wrap.appendChild(cur);
  el.appendChild(wrap);
  el.style.fontSize = S.size + 'px';
  if (wrap.offsetHeight > S.size * 1.5 * S.maxLines + 2) el.style.fontSize = S.minSize + 'px'; // offsetHeight is in the stage's own pixels, before the scale
  // the hand's rhythm, the film's exactly (api/_lib/score.ts typingWeights, seeded by the painting): the film's
  // weights run over the text WITH its spaces; the wall has no glyph for a space, so its weight folds into the next letter
  const weights = typingWeights(text, seed); const cum = []; let acc = 0, gi = 0;
  for (let i = 0; i < text.length; i++) { if (text[i] === ' ') { acc += weights[i]; continue; } cum[gi++] = acc; acc += weights[i]; }
  const { unit, shift } = typingPace(text, seed);
  SC = scoreFor(shift, opening); // this reveal's score: a long line takes its time and everything after it waits (film.ts does the same)
  cues = cum.map(c => S.start + c * unit);
  return cur;
}
// rhythm:begin — a copy of api/_lib/score.ts seeded + typingWeights; test/sound.test.mjs evaluates this block against the original
function seeded(seed) {
  let h = 1779033703 ^ seed.length;
  for (let i = 0; i < seed.length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 3432918353), h = (h << 13) | (h >>> 19);
  let a = h >>> 0;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const RHYTHM = { wordStart: 1.5, capital: 1.25, mark: 1.15, pauseComma: 3, pauseStop: 5, pair: 0.75, jitter: 0.2, hesitate: 0.06, hesitation: 2.4, burst: 0.8, burstLen: 3 };
const PAIRS = new Set(['th', 'he', 'in', 'er', 'an', 're', 'on', 'at', 'en', 'nd', 'ti', 'es', 'or', 'te', 'of', 'ed', 'is', 'it', 'al', 'ar', 'st', 'to', 'nt', 'ng', 'se', 'ha', 'as', 'ou', 'io', 'le', 've', 'co', 'me', 'de', 'hi', 'ri', 'ro', 'ic', 'ne', 'ea', 'ra', 'ce', 'li', 'ch', 'll', 'be', 'ma', 'si', 'om', 'ur']);
function typingWeights(chars, seed) {
  const R = RHYTHM, rand = seeded(seed), out = []; let burst = 0;
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i], prev = i > 0 ? chars[i - 1] : '';
    let w = 1;
    if (/[.!?…]/.test(prev)) w *= R.pauseStop; else if (/[,;:—–]/.test(prev)) w *= R.pauseComma;
    if (prev === ' ') w *= R.wordStart;
    if (/[A-Z]/.test(ch)) w *= R.capital;
    if (/[^\sA-Za-z0-9\u00C0-\u024F]/.test(ch)) w *= R.mark;
    if (prev && PAIRS.has((prev + ch).toLowerCase())) w *= R.pair;
    w *= 1 + (rand() * 2 - 1) * R.jitter;
    if (burst > 0) { w *= R.burst; burst--; }
    else if (i > 2 && rand() < R.hesitate) { w *= R.hesitation; burst = R.burstLen; }
    out.push(w);
  }
  return out;
}
function typingPace(chars, seed) {
  const S = SCORE.sentence, sum = typingWeights(chars, seed).reduce((a, b) => a + b, 0);
  const unit = Math.min(S.maxCharInterval, Math.max(S.minCharInterval, (S.typedBy - S.glyphFade - S.start) / (sum + 1)));
  const need = S.start + (sum + 1) * unit + S.glyphFade;
  return { unit, shift: Math.max(0, Math.round((need - S.typedBy) * 100) / 100) };
}
function scoreFor(shift, opening = 'dark', transition = SCORE.painting.transition) {
  const sc = JSON.parse(JSON.stringify(SCORE));
  const op = SCORE.openings[opening]; sc.opening = opening;
  sc.painting.fadeStart = op.fadeStart; sc.painting.fadeEnd = op.fadeEnd; sc.painting.fromFill = op.fromFill; sc.painting.scrim = op.scrim; sc.painting.floor = op.floor; sc.painting.band = op.band;
  if (opening === 'dark') { // the transition from the line to the picture (score.ts TRANSITIONS); the film does the same
    const tr = SCORE.transitions[transition]; sc.painting.transition = transition;
    sc.painting.fadeStart = tr.canvasStart; sc.painting.fadeEnd = tr.canvasEnd; sc.painting.fillStart = tr.fillStart; sc.painting.fillEnd = tr.fillEnd;
    sc.painting.blur = tr.blur; sc.painting.blurStart = tr.blurStart; sc.painting.blurEnd = tr.blurEnd; sc.painting.scaleFrom = tr.scaleFrom;
  }
  if (!shift) return sc;
  const mv = (o, keys) => { for (const k of keys) if (typeof o[k] === 'number') o[k] = Math.round((o[k] + shift) * 100) / 100; };
  mv(sc.sentence, ['typedBy', 'fadeStart', 'fadeEnd']);
  mv(sc.painting, op.fadeStart === 0 ? ['fadeEnd', 'pushStart', 'pushEnd'] : ['fadeStart', 'fadeEnd', 'fillStart', 'fillEnd', 'blurStart', 'blurEnd', 'pushStart', 'pushEnd']);
  mv(sc.signature, ['start', 'end']); mv(sc.title, ['start']); mv(sc.signoff, ['start']); mv(sc.hold, ['start']);
  mv(sc.audio.shimmer, ['from', 'to', 'until']); mv(sc.audio.note, ['at']);
  sc.total = Math.round((sc.total + shift) * 100) / 100;
  return sc;
}
// rhythm:end
const mix = (a, b, k) => { const c = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)), A = c(a), B = c(b), t = clip(k); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const cut = (text, max) => text.length <= max ? text : (text.slice(0, max + 1).match(/^[\s\S]*[,;:.!?](?=\s)/) || [text.slice(0, max).replace(/\s\S*$/, '')])[0].replace(/[\s,;:]+$/, '') + '…';

async function startReveal(c) {
  playing = c; document.getElementById('wall').classList.add('revealing');
  $('idle').style.display = 'none';
  const words = c.commission ? (c.line || cut(c.commission, SCORE.sentence.maxChars)) : 'a commission';
  const cursor = layoutSentence(words, c.id, c.opening || 'dark'); // the A/B of the opening (score.ts OPENINGS): the wall plays the film's own
  const S = SC;
  $('fill').style.backgroundImage = `url("${c.image}")`;
  const base = c.raw && c.signature ? c.raw : c.image;
  const img = $('painting'); img.src = base;
  await new Promise(ok => { if (img.complete && img.naturalWidth) ok(); else { img.onload = ok; img.onerror = ok; } });
  const sig = $('sig'); sigGeom = null;
  if (c.raw && c.signature && img.naturalWidth) {
    const k = (S.canvas ? S.canvas.w : 832) / img.naturalWidth;
    sigGeom = { x: c.signature.x * k, y: c.signature.y * k, w: c.signature.w * k, h: c.signature.h * k };
    sig.src = c.signature.image; Object.assign(sig.style, { left: sigGeom.x + 'px', top: sigGeom.y + 'px', width: sigGeom.w + 'px', height: sigGeom.h + 'px', display: 'block' });
  } else sig.style.display = 'none';
  $('title').textContent = c.title || 'Night Shift';
  $('endline').textContent = c.endLine || '';
  if (S.canvas) Object.assign($('canvas').style, { left: S.canvas.left + 'px', top: S.canvas.top + 'px', width: S.canvas.w + 'px', height: S.canvas.h + 'px' }); // the film's geometry, not a copy
  if (S.caption) Object.assign($('caption').style, { left: S.caption.x + 'px', top: S.caption.top + 'px', width: S.caption.maxW + 'px', gap: S.signoff.gap + 'px' });
  // the sound: the film's own track when the painting has one (the same samples the Reel carries — keys on the
  // letters, the bed, the pen on the ink; api/_lib/sound.ts), and the reveal is clocked FROM it so picture and sound
  // cannot drift. A painting not yet filmed gets the bed and the note from WebAudio (below).
  const track = await audio.track(c.film);
  if (!track) audio.reveal();
  t0 = performance.now(); cancelAnimationFrame(raf);
  const frame = () => {
    const t = track ? track.currentTime : (performance.now() - t0) / 1000;
    render(t, cursor);
    if (t < S.total && !(track && track.ended)) raf = requestAnimationFrame(frame); else endReveal();
  };
  raf = requestAnimationFrame(frame);
}
function render(t, cursor) {
  const S = SC, P = S.painting, G = S.signature, Sn = S.sentence;
  // the sentence
  const sen = $('sentence');
  let pen = -1;
  glyphs.forEach((g, i) => { g.style.opacity = clip((t - cues[i]) / Sn.glyphFade); g.style.color = mix(Sn.emberColor, S.colors.ink, (t - cues[i]) / Sn.ember); if (t >= cues[i]) pen = i; }); // each letter lands as an ember and cools to ink (film.ts)
  const last = cues.length ? cues[cues.length - 1] + Sn.glyphFade : 0;
  cursor.style.opacity = t < last ? 1 : 0.55 + 0.45 * Math.sin(2 * Math.PI * 0.9 * (t - last));
  const at = pen >= 0 ? glyphs[pen] : glyphs[0];
  if (at) { cursor.style.left = (pen >= 0 ? at.offsetLeft + at.offsetWidth : at.offsetLeft) + 4 + 'px'; cursor.style.top = at.offsetTop + 'px'; }
  const fade = clip((t - Sn.fadeStart) / (Sn.fadeEnd - Sn.fadeStart));
  sen.style.opacity = 1 - fade;
  sen.style.transform = `translateY(${-Sn.rise * t}px) scale(${1 + (Sn.driftScale - 1) * fade})`;
  sen.style.display = t >= Sn.fadeEnd ? 'none' : 'flex';
  // the painting surfaces and pushes in: from black (dark), or over the fill under a scrim that lifts with the sentence (lit)
  const surfaced = clip((t - P.fadeStart) / (P.fadeEnd - P.fadeStart));
  sen.classList.toggle('lit', !!P.fromFill); sen.style.setProperty('--band', P.band + 'px'); sen.style.setProperty('--scrim', P.scrim);
  if (P.fromFill) { $('canvas').style.opacity = P.floor + (1 - P.floor) * surfaced; $('black').style.opacity = 0; $('canvas').style.filter = ''; }
  else { // dark: the fill (the room's light) first, a blurred pass sharpening under the sharp one when the take has one, then the canvas (score.ts TRANSITIONS; film.ts does the same)
    const fillRisen = clip((t - P.fillStart) / (P.fillEnd - P.fillStart)), blurRisen = P.blur > 0 ? clip((t - P.blurStart) / (P.blurEnd - P.blurStart)) : 0;
    $('black').style.opacity = 1 - fillRisen;
    $('canvas').style.opacity = Math.max(blurRisen, surfaced);
    $('canvas').style.filter = P.blur > 0 && surfaced < 1 ? `blur(${(P.blur * (1 - surfaced)).toFixed(1)}px)` : '';
  }
  $('canvas').style.transform = `scale(${P.scaleFrom - (P.scaleFrom - P.scaleTo) * clip((t - P.pushStart) / (P.pushEnd - P.pushStart))})`;
  // the painter signs
  if (sigGeom) {
    const p = ease((t - G.start) / (G.end - G.start));
    const edge = -G.edgePx + (sigGeom.w + 2 * G.edgePx) * p;
    const m = t < G.start ? 'linear-gradient(to right, transparent 0, transparent 100%)' : t >= G.end ? 'none' : `linear-gradient(to right, #000 ${edge - G.edgePx}px, transparent ${edge}px)`;
    $('sig').style.maskImage = m; $('sig').style.webkitMaskImage = m;
  }
  // the title and the last words
  $('title').style.opacity = clip((t - S.title.start) / S.title.fadeIn);
  $('endline').style.opacity = clip((t - S.signoff.start) / S.signoff.fadeIn);
}
function endReveal() {
  audio.stop();
  if (playing && !revealed.has(playing.id)) { revealed.add(playing.id); loop.push(playing); const li = [...$('queue').children].find(l => l.dataset.id === playing.id); if (li) li.remove(); }
  playing = null; document.getElementById('wall').classList.remove('revealing');
  setTimeout(tick, 1800);
}
function stopReveal() { cancelAnimationFrame(raf); audio.stop(); playing = null; document.getElementById('wall').classList.remove('revealing'); $('black').style.opacity = 1; setTimeout(tick, 600); }

// ---- what plays next: a new painting first, else the loop of tonight's, else the window ----
function tick() {
  if (playing) return;
  if (toReveal.length) { markNext(); return startReveal(toReveal.shift()); }
  if (loop.length) { const c = loop[loopIndex++ % loop.length]; audio.prime(loop[loopIndex % loop.length]?.film); return startReveal(c); }
  $('black').style.opacity = 1; $('idle').style.display = 'flex';
  setTimeout(tick, 4000);
}
setInterval(poll, 4000); poll();

// ---- audio: the film's track when there is one; else the bed and the note, generated (SCORE.audio); unlocked by the first tap ----
const audio = {
  ctx: null, el: null, primed: new Map(), nodes: [],
  init() { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} },
  db: d => Math.pow(10, d / 20),
  /** Start loading a film's track the moment its painting is queued, so the reveal never waits on the network
   *  (a cold film took ~1 s to become playable in the check of 2026-09-06; the first one missed a 4 s wait). */
  prime(url) {
    if (!url || !this.ctx || this.primed.has(url)) return;
    const el = Object.assign(document.createElement('audio'), { preload: 'auto', src: url }); el.load(); this.primed.set(url, el);
    if (this.primed.size > 4) this.primed.delete(this.primed.keys().next().value);
  },
  /** The film's audio, playing from 0, or null (no film yet, no tap yet, or it would not load in time). */
  async track(url) {
    if (!url || !this.ctx) return null;
    const el = this.primed.get(url) ?? Object.assign(document.createElement('audio'), { preload: 'auto', src: url });
    this.primed.delete(url);
    if (this.el && this.el !== el) { this.el.pause(); this.el.removeAttribute('src'); }
    this.el = el; el.currentTime = 0;
    const ok = el.readyState >= 3 || await new Promise(res => { const t = setTimeout(() => res(false), 6000); el.oncanplay = () => { clearTimeout(t); res(true); }; el.onerror = () => { clearTimeout(t); res(false); }; if (el.readyState >= 3) { clearTimeout(t); res(true); } });
    if (!ok) return null;
    try { await el.play(); } catch { return null; }
    return el;
  },
  stop() { if (this.el) { this.el.pause(); } for (const n of this.nodes) { try { n.stop(); } catch {} } this.nodes = []; },
  tone(hz, gain, at, dur, attack = 0.01, release = 0.4) {
    const c = this.ctx; if (!c) return; const o = c.createOscillator(), g = c.createGain(); o.frequency.value = hz; o.connect(g); g.connect(c.destination);
    const s = c.currentTime + at; g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(gain, s + attack); g.gain.setValueAtTime(gain, s + Math.max(attack, dur - release)); g.gain.linearRampToValueAtTime(0, s + dur); o.start(s); o.stop(s + dur + 0.05); this.nodes.push(o);
  },
  arrive() { this.tone(660, this.db(-30), 0, 0.25, 0.005, 0.2); },
  /** Without a film: the bed (the root twice, beating; a fifth; the octave) and the note under the title. */
  reveal() {
    const c = this.ctx; if (!c || !SCORE) return; const A = SCORE.audio, T = SCORE.total, B = A.bed, g = this.db(B.gainDb) * 0.5;
    this.tone(B.hz, g, 0, T, B.fadeIn, B.fadeOut); this.tone(B.hz + B.beatHz, g, 0, T, B.fadeIn, B.fadeOut);
    this.tone(B.hz * 1.5, g * 0.45, 0, T, B.fadeIn, B.fadeOut); this.tone(B.hz * 2, g * 0.3, 0, T, B.fadeIn, B.fadeOut);
    const N = A.note, o = c.createOscillator(), ng = c.createGain(); o.frequency.value = N.hz; o.connect(ng); ng.connect(c.destination);
    const n0 = c.currentTime + N.at; ng.gain.setValueAtTime(this.db(N.gainDb), n0); ng.gain.exponentialRampToValueAtTime(0.0001, n0 + N.decay * 2); o.start(n0); o.stop(n0 + N.decay * 2.1); this.nodes.push(o);
  },
};
