<style>
  :root { --ground:#0b1220; --surface:#131c2f; --screen:#0e1526; --line:#26324c; --ink:#ece6d8; --muted:#98a2b3; --amber:#f0a83a; --amber-ink:#ffd58a; --teal:#3a9c95; --red:#d1614f;
    --display:'Instrument Serif',Georgia,serif; --mono:'IBM Plex Mono',Menlo,monospace; --body:'IBM Plex Sans',-apple-system,Helvetica,sans-serif; --hand:'Caveat',cursive; }
  html { background: var(--ground); }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--body); line-height:1.4; }
  main { max-width: 74rem; margin: 0 auto; padding: 2.5rem 1.25rem 6rem; display: grid; gap: 3rem; }
  h1 { font-family: var(--display); font-weight: 400; font-size: 2.4rem; line-height: 1.05; margin: 0; text-wrap: balance; }
  h2 { font-family: var(--display); font-weight: 400; font-size: 1.7rem; margin: 0; line-height: 1.1; }
  .eyebrow { font-family: var(--mono); font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); }
  .lede { color: var(--muted); margin: .6rem 0 0; max-width: 60ch; }
  .strip { display: grid; gap: 1rem; }
  .strip header { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  .tag { font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; padding: .2rem .5rem; border-radius: 3px; background: #1f4f4c; color: var(--ink); }
  .tag.pick { background: var(--amber); color: var(--ground); }
  .frames { display: grid; grid-template-columns: repeat(4, minmax(15rem, 1fr)); gap: 1rem; overflow-x: auto; padding-bottom: .5rem; scroll-snap-type: x mandatory; }
  .frame { display: grid; gap: .6rem; scroll-snap-align: start; }
  .screen { aspect-ratio: 16/10; background: var(--screen); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; position: relative; font-size: .7rem; }
  .pick .screen { border-color: #3a4a6c; }
  .cap { font-family: var(--display); font-size: 1.15rem; line-height: 1.2; color: var(--ink); }
  .cap small { display: block; font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: .2rem; }
  /* table tent */
  .tent { position:absolute; inset:0; display:grid; place-items:center; background: radial-gradient(ellipse at 50% 120%, #2a2415 0%, var(--screen) 60%); }
  .tent .card { width: 62%; background:#efe7d3; color:#1a1a1a; border-radius:4px; padding:.7rem .8rem; display:grid; grid-template-columns: 1fr auto; gap:.6rem; align-items:center; box-shadow: 0 14px 30px -12px #000; }
  .tent .card b { font-family: var(--display); font-weight:400; font-size:1.05rem; display:block; }
  .tent .card span { font-size:.62rem; color:#444; }
  .qr { width: 3.2rem; height: 3.2rem; display:grid; grid-template-columns: repeat(9,1fr); gap:1px; }
  .qr i { background:#1a1a1a; } .qr i.o { background:transparent; }
  /* phone */
  .phone { position:absolute; left:50%; top:6%; transform:translateX(-50%); width:38%; height:110%; background:#000; border:2px solid #333; border-radius:14px 14px 0 0; padding:.6rem .5rem; display:grid; gap:.4rem; align-content:start; }
  .bubble { padding:.35rem .5rem; border-radius:10px; max-width:92%; line-height:1.3; }
  .bubble.me { background:#2b6cf0; color:#fff; justify-self:end; }
  .bubble.them { background:#1f2734; color:var(--ink); }
  .phone img { width:100%; border-radius:6px; display:block; }
  .phone .share { background:var(--amber); color:var(--ground); text-align:center; border-radius:6px; padding:.3rem; font-family:var(--mono); font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; }
  .phone .title { font-family:var(--display); font-size:.95rem; color:var(--amber-ink); }
  /* the wall (live) */
  .wall { position:absolute; inset:0; display:grid; grid-template-columns: 1.1fr 1.5fr 1fr; gap:.5rem; padding:.55rem; }
  .col { display:grid; gap:.35rem; align-content:start; min-width:0; }
  .col .h { font-family:var(--mono); font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .sent { background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:.3rem .4rem; opacity:.55; }
  .sent.now { opacity:1; border-color:var(--amber); }
  .note { font-family:var(--display); font-size:.8rem; color:var(--amber-ink); min-height:2.2em; }
  .canvas { position:relative; aspect-ratio:4/5; background:#05080f; border-radius:3px; overflow:hidden; }
  .canvas img { width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition: opacity 1.6s ease; filter: brightness(.2); }
  .canvas.on img { opacity:1; filter: brightness(1); transition: opacity 1.6s ease, filter 2.4s ease; }
  .canvas .sig { position:absolute; right:6%; bottom:4%; font-family:var(--hand); color:#f3c97a; font-size:1rem; opacity:0; transform: rotate(-4deg); }
  .canvas.signed .sig { opacity:.9; transition: opacity .6s; }
  .stamps { display:grid; gap:.25rem; }
  .stamp { font-family:var(--mono); font-size:.6rem; padding:.2rem .35rem; border-radius:3px; border:1px solid var(--line); color:var(--muted); opacity:.35; }
  .stamp.ok { border-color:var(--teal); color:#9fe0da; opacity:1; }
  .stamp.no { border-color:var(--red); color:#ffb3a7; opacity:1; }
  .reject { display:grid; grid-template-columns: 2.2rem 1fr; gap:.35rem; align-items:center; opacity:0; transition:opacity .5s; }
  .reject.on { opacity:1; }
  .reject img { width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:2px; filter: saturate(.6); }
  .reject span { font-family:var(--mono); font-size:.58rem; color:#ffb3a7; }
  .sentto { font-family:var(--mono); font-size:.6rem; color:var(--amber-ink); opacity:0; transition:opacity .5s; }
  .sentto.on { opacity:1; }
  .live { position:absolute; bottom:.4rem; right:.5rem; font-family:var(--mono); font-size:.55rem; letter-spacing:.1em; color:var(--red); }
  .live::before { content:''; display:inline-block; width:.4rem; height:.4rem; background:var(--red); border-radius:50%; margin-right:.3rem; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  /* terminal */
  .term { position:absolute; inset:0; padding:.8rem; font-family:var(--mono); font-size:.68rem; color:#cfd6e4; background:#0a0e18; }
  .term .p { color:var(--teal); } .term .c { color:var(--amber-ink); }
  /* transcript */
  .chat { position:absolute; inset:0; padding:.5rem; display:grid; gap:.3rem; align-content:start; }
  .chat .who { font-family:var(--mono); font-size:.55rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .chat .line { padding:.3rem .45rem; border-radius:6px; background:var(--surface); border:1px solid var(--line); max-width:88%; }
  .chat .line.painter { border-color:#3a4a6c; font-family:var(--display); font-size:.85rem; color:var(--amber-ink); justify-self:end; }
  /* verdict */
  .verdict { position:absolute; inset:0; display:grid; grid-template-columns: 1fr 1.1fr; gap:.6rem; padding:.6rem; }
  .verdict img { width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:3px; }
  .verdict .v { display:grid; gap:.35rem; align-content:center; }
  .verdict .grade { font-family:var(--display); font-size:1.5rem; color:var(--amber-ink); line-height:1; }
  .verdict .by { font-family:var(--mono); font-size:.55rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  /* scoreboard */
  .board { position:absolute; inset:0; padding:.6rem .7rem; display:grid; gap:.25rem; align-content:start; }
  .board .h { font-family:var(--display); font-size:.95rem; color:var(--ink); margin-bottom:.2rem; }
  .row { display:grid; grid-template-columns: 1fr auto; font-family:var(--mono); font-size:.6rem; color:var(--muted); border-bottom:1px solid var(--line); padding:.15rem 0; }
  .dot { display:inline-block; width:.5rem; height:.5rem; border-radius:50%; margin-left:.2rem; vertical-align:middle; }
  .y{background:var(--teal)} .p{background:var(--amber)} .n{background:var(--red)}
  /* reel */
  .reel { position:absolute; left:50%; top:4%; transform:translateX(-50%); width:36%; height:100%; background:#000; border-radius:10px 10px 0 0; overflow:hidden; border:2px solid #333; }
  .reel img { width:100%; height:100%; object-fit:cover; display:block; }
  .reel .ov { position:absolute; inset:0; display:grid; align-content:end; padding:.5rem; gap:.25rem; background: linear-gradient(transparent 55%, rgba(0,0,0,.75)); }
  .reel .t { font-family:var(--display); font-size:.9rem; color:var(--amber-ink); }
  .reel .m { font-family:var(--mono); font-size:.55rem; color:var(--muted); }
  .reel.dark img { filter: brightness(.25); }
  .reel .typing { position:absolute; top:40%; left:8%; right:8%; font-family:var(--mono); font-size:.62rem; color:#fff; border-right:2px solid var(--amber); padding-right:.1rem; }
  /* decision */
  .decide { border-top:1px solid var(--line); padding-top:2rem; display:grid; gap:1rem; }
  .btns { display:grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap:.75rem; }
  button { font: inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:1rem 1.1rem; text-align:left; display:grid; gap:.25rem; }
  button:focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
  button b { font-family:var(--display); font-weight:400; font-size:1.25rem; }
  button small { color:var(--muted); font-size:.85rem; }
  button.on { border-color:var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
  button.on small::before { content:'Picked · '; color:var(--amber-ink); }
  .state { font-family:var(--mono); font-size:.72rem; color:var(--muted); min-height:1.2em; }
  .what { margin:0; color:var(--muted); max-width:62ch; font-size:1.02rem; }
  .deeper { margin-left:auto; font:inherit; font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--amber-ink); background:transparent; border:1px solid var(--amber); border-radius:999px; padding:.35rem .8rem; cursor:pointer; }
  .deeper:hover, .deeper:focus-visible { background:var(--amber); color:var(--ground); outline:none; }
  .frame { cursor:pointer; border-radius:8px; }
  .frame:hover .screen, .frame:focus-visible .screen { border-color:var(--amber); }
  .frame:focus-visible { outline:2px solid var(--amber); outline-offset:4px; }
  .hint { display:inline-grid; place-items:center; width:1rem; height:1rem; border-radius:50%; border:1px solid var(--muted); font:500 .6rem/1 var(--mono); font-style:normal; color:var(--muted); margin-right:.4rem; vertical-align:-1px; }
  .frame:hover .hint { border-color:var(--amber); color:var(--amber); }
  .foot { border-top:1px solid var(--line); padding-top:1.5rem; color:var(--muted); }
  .foot p { margin:0; }
  dialog { background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:0; width:min(44rem, 92vw); max-height:88vh; }
  dialog::backdrop { background:rgba(4,8,16,.75); }
  .dlg { padding:1.6rem 1.8rem 2rem; display:grid; gap:1rem; overflow:auto; max-height:88vh; box-sizing:border-box; }
  .dlg .eyebrow { margin:0; }
  .dlg h3 { font-family:var(--display); font-weight:400; font-size:1.9rem; line-height:1.1; margin:0; text-wrap:balance; }
  .dlg h4 { font-family:var(--mono); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--amber); margin:.6rem 0 0; }
  .dlg p { margin:0; max-width:65ch; line-height:1.55; }
  .dlg ul { margin:0; padding-left:1.1rem; max-width:65ch; line-height:1.5; display:grid; gap:.3rem; }
  .dlg .close { position:sticky; top:0; justify-self:end; font:inherit; font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; background:var(--ground); color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:.3rem .7rem; cursor:pointer; }
  .dlg .close:hover, .dlg .close:focus-visible { color:var(--ink); border-color:var(--amber); outline:none; }
  @media (prefers-reduced-motion: reduce) { .canvas img, .reject, .sentto, .live::before { transition:none; animation:none; } }
</style>
